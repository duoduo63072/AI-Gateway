services:
  # 数据库使用外部 PostgreSQL（如阿里云 RDS），不在 compose 内启动。
  # 连接信息通过 .env / 宿主环境注入（见 .env.example 与 docs/onboarding/environment-guide.md）。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  gateway:
    build: .
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      # 外部 PostgreSQL（如阿里云 RDS）连接信息，从宿主环境/.env 注入
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # 百炼密钥与网关主密钥从宿主环境/.env 注入
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      # 容器内有 collector，开启导出与全采样（本地裸跑时这两项默认关，不刷屏）
      OTLP_METRICS_EXPORT: "true"
      OTEL_SAMPLING: "1.0"
      # 上游百炼 MaaS（Anthropic 端点）；与 application.yml 默认一致，显式声明防漂移
      DASHSCOPE_BASE_URL: https://token-plan.cn-beijing.maas.aliyuncs.com
    ports:
      - "8080:8080"
